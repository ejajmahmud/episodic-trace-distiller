[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "episodic-trace-distiller"
version = "0.1.0"
description = "Compresses raw multi-turn agent execution logs into structured episodic lessons (trigger, error, verified fix)"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Ejaj Mahmud", email = "dev@ejajmahmud.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
episodic-trace-distiller = "episodic_trace_distiller.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["episodic_trace_distiller*"]
